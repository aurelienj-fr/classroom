framework:
    messenger:
        failure_transport: failed

        transports:
            # E-mails are queued in the database and sent by a worker:
            #   php bin/console messenger:consume async
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

when@test:
    framework:
        messenger:
            transports:
                # Nothing leaves the test process; use assertQueuedEmailCount() & co.
                async: 'in-memory://'
